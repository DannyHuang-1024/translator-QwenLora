model_name_or_path: Qwen/Qwen3-0.6B
dataset_name: Helsinki-NLP/opus-100
dataset_config: en-zh
source_language: English
target_language: Chinese
source_field: en
target_field: zh

# A bounded subset keeps the first Colab run short and reproducible. Increase
# these two values after a successful smoke run.
max_train_samples: 20000
max_eval_samples: 1000
validation_size: 0.05
seed: 42
max_length: 768

use_4bit: true
bnb_4bit_quant_type: nf4
use_nested_quant: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

num_train_epochs: 2
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 0.0002
warmup_ratio: 0.03
weight_decay: 0.0
logging_steps: 10
save_steps: 250
eval_steps: 250
save_total_limit: 2

drive:
  enabled: true
  mount_point: /content/drive
  subdirectory: MyDrive/qwen3-translation

output_dir: checkpoints/qwen3-0.6b-en-zh-lora
dataset_cache_dir: /content/drive/MyDrive/qwen3-translation/cache

